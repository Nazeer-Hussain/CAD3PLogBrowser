<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAD 3P Log Browser &mdash; Announcements</title>
<link rel="icon" type="image/gif" href="help/images/cad3plog.gif">
<style>
    :root {
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace;

        --ink:        #1c1e22;
        --ink-soft:   #2b2e34;
        --paper:      #faf8f4;
        --card:       #ffffff;
        --surface-alt:#f2efe7;
        --border:     #e2ddd0;
        --text:       #22252a;
        --muted:      #78756d;
        --heading:    #1c1e22;

        --accent:      #b8721f;
        --accent-dark: #8f5817;
        --accent-soft: #f3e6d2;
        --green:       #2f8f52;
        --blue:        #2f6f8f;
        --blue-soft:   #d9ecf3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: var(--font-body);
        background: var(--paper);
        color: var(--text);
        line-height: 1.7;
        font-size: 15px;
    }
    header {
        background: linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 100%);
        color: #fff;
        padding: 34px 24px 30px;
        border-bottom: 3px solid var(--accent);
    }
    .header-inner { max-width: 700px; margin: 0 auto; }
    header h1 { font-family: var(--font-mono); font-weight: 700; font-size: 22px; margin-bottom: 8px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
    header h1 img { width: 26px; height: 26px; }
    header p.sub { color: #cfcabe; font-size: 14px; margin-bottom: 10px; }
    header a.back { color: #cfcabe; font-size: 13.5px; text-decoration: none; }
    header a.back:hover { color: #fff; }

    main { max-width: 700px; margin: 36px auto 60px; padding: 0 24px; }

    #entries { position: relative; padding-left: 28px; }
    #entries::before {
        content: '';
        position: absolute;
        left: 5px; top: 8px; bottom: 8px;
        width: 2px;
        background: var(--border);
    }

    .entry {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px 24px;
        margin-bottom: 14px;
    }
    .entry::before {
        content: '';
        position: absolute;
        left: -28px; top: 22px;
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--card);
        border: 2px solid var(--border);
    }
    .entry:first-child::before { border-color: var(--accent); background: var(--accent); }

    .entry-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
    }
    .entry-title { font-size: 16px; font-weight: 700; color: var(--heading); }
    .entry-date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

    .entry-badge {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        margin-right: 8px;
        vertical-align: middle;
    }
    .badge-upcoming { background: var(--blue); }
    .badge-release  { background: var(--green); }
    .badge-notice   { background: var(--accent); }

    .entry-body { font-size: 14.5px; color: var(--text); }

    #loading, #empty { text-align: center; color: var(--muted); padding: 30px; }
</style>
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Announcements</h1>
        <p class="sub">Upcoming versions, planned changes, and other news from the maintainer.</p>
        <a class="back" href="index.html">&larr; Back to CAD 3P Log Browser</a>
        &nbsp;&middot;&nbsp;
        <a class="back" href="changelog.html">Version History</a>
        &nbsp;&middot;&nbsp;
        <a class="back" href="videos.html">Videos</a>
    </div>
</header>

<main>
    <p id="loading">Loading announcements&hellip;</p>
    <div id="entries"></div>
</main>

<script>
fetch('announcements.json')
    .then(r => r.json())
    .then(function (items) {
        var container = document.getElementById('entries');
        document.getElementById('loading').style.display = 'none';

        if (!items || items.length === 0) {
            container.innerHTML = '<p id="empty">No announcements right now. Check back later.</p>';
            return;
        }

        var badgeLabels = { upcoming: 'Upcoming', release: 'Released', notice: 'Notice' };

        items.forEach(function (item) {
            var type = item.type || 'notice';
            var badgeClass = 'badge-' + (badgeLabels[type] ? type : 'notice');
            var badgeLabel = badgeLabels[type] || 'Notice';

            var entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML =
                '<div class="entry-header">' +
                    '<span class="entry-title">' +
                        '<span class="entry-badge ' + badgeClass + '">' + badgeLabel + '</span>' +
                        (item.title || '') +
                    '</span>' +
                    '<span class="entry-date">' + (item.date || '') + '</span>' +
                '</div>' +
                '<div class="entry-body">' + (item.body || '') + '</div>';
            container.appendChild(entry);
        });
    })
    .catch(function () {
        document.getElementById('loading').textContent =
            'Could not load announcements right now. Try again shortly.';
    });
</script>

</body>
</html>
