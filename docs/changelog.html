<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAD 3P Log Browser &mdash; Version History</title>
<style>
    :root {
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace;

        --ink:        #1c1e22;
        --ink-soft:   #2b2e34;
        --paper:      #faf8f4;
        --card:       #ffffff;
        --surface-alt:#f2efe7;
        --border:     #e2ddd0;
        --text:       #22252a;
        --muted:      #78756d;
        --heading:    #1c1e22;

        --accent:      #b8721f;
        --accent-dark: #8f5817;
        --accent-soft: #f3e6d2;
        --green:       #2f8f52;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: var(--font-body);
        background: var(--paper);
        color: var(--text);
        line-height: 1.7;
        font-size: 15px;
    }
    header {
        background: linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 100%);
        color: #fff;
        padding: 34px 24px 30px;
        border-bottom: 3px solid var(--accent);
    }
    .header-inner { max-width: 700px; margin: 0 auto; }
    header h1 { font-family: var(--font-mono); font-weight: 700; font-size: 22px; margin-bottom: 8px; letter-spacing: -0.01em; }
    header a.back { color: #cfcabe; font-size: 13.5px; text-decoration: none; }
    header a.back:hover { color: #fff; }

    main { max-width: 700px; margin: 36px auto 60px; padding: 0 24px; }

    #entries { position: relative; padding-left: 28px; }
    #entries::before {
        content: '';
        position: absolute;
        left: 5px; top: 8px; bottom: 8px;
        width: 2px;
        background: var(--border);
    }

    .entry {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px 24px;
        margin-bottom: 14px;
    }
    .entry::before {
        content: '';
        position: absolute;
        left: -28px; top: 22px;
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--card);
        border: 2px solid var(--border);
    }
    .entry:first-child::before { border-color: var(--accent); background: var(--accent); }

    .entry-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
    }
    .entry-version { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--heading); }
    .entry-version .latest-tag {
        font-family: var(--font-body);
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #fff;
        background: var(--green);
        padding: 2px 8px;
        border-radius: 4px;
        margin-left: 8px;
        vertical-align: middle;
    }
    .entry-date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .entry-notes { font-size: 14.5px; margin-bottom: 14px; }
    .entry-download {
        display: inline-block;
        color: var(--accent-dark);
        text-decoration: none;
        font-weight: 600;
        font-size: 13.5px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 6px 14px;
    }
    .entry-download:hover { background: var(--accent-soft); }
    .entry-size { color: var(--muted); font-size: 12.5px; margin-left: 8px; font-variant-numeric: tabular-nums; }

    #loading, #empty { text-align: center; color: var(--muted); padding: 30px; }
</style>
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Version History</h1>
        <a class="back" href="index.html">&larr; Back to CAD 3P Log Browser</a>
    </div>
</header>

<main>
    <p id="loading">Loading version history&hellip;</p>
    <div id="entries"></div>
</main>

<script>
fetch('versions.json')
    .then(r => r.json())
    .then(function (versions) {
        var container = document.getElementById('entries');
        document.getElementById('loading').style.display = 'none';

        if (!versions || versions.length === 0) {
            container.innerHTML = '<p id="empty">No releases yet.</p>';
            return;
        }

        versions.forEach(function (v, i) {
            var sizeText = v.sizeBytes ? (v.sizeBytes / (1024*1024)).toFixed(1) + ' MB' : '';
            var entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML =
                '<div class="entry-header">' +
                    '<span class="entry-version">v' + v.version +
                        (i === 0 ? '<span class="latest-tag">Latest</span>' : '') +
                    '</span>' +
                    '<span class="entry-date">' + (v.date || '') + '</span>' +
                '</div>' +
                '<div class="entry-notes">' + (v.notes || '') + '</div>' +
                '<a class="entry-download" href="' + v.zip + '">Download v' + v.version + ' (.zip)</a>' +
                '<span class="entry-size">' + sizeText + '</span>';
            container.appendChild(entry);
        });
    })
    .catch(function () {
        document.getElementById('loading').textContent =
            'Could not load version history right now. Try again shortly.';
    });
</script>

</body>
</html>
