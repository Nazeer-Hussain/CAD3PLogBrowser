# GitLab Pages — internal mirror of the public GitHub Pages site.
#
# Why this exists: the app's releases are hosted on GitHub Pages, but PTC's
# Zscaler proxy intercepts .zip downloads from the public internet and holds
# them for security analysis (HTTP 403 + a notice page, clearing only after a
# scan that can take several minutes). Serving the identical site from the
# INTERNAL GitLab keeps that traffic inside the corporate network, so internal
# colleagues download without hitting the internet proxy at all.
#
# Deliberately does NOT rebuild the application. The docs/ folder committed to
# master already contains everything the site serves -- pages, help guide, and
# the packaged release .zips, all produced by the GitHub Actions pipeline. This
# job only republishes those bytes, so it needs no Windows runner, no MSBuild,
# and no .NET toolchain: any basic Linux/docker or shell runner will do.

pages:
  # Only `cp` and `sed` are needed. If this project's runners can't pull from
  # Docker Hub, swap in any internally-available image, or delete the `image:`
  # line entirely when using a shell runner.
  image: alpine:latest

  # Publish only from the default branch -- feature branches shouldn't
  # overwrite the live internal site.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  script:
    # GitLab Pages serves whatever ends up in `public/`.
    - cp -r docs public

    # docs/version.json is the manifest the app polls, and its downloadUrl is
    # the one absolute URL in the whole site (every other link -- versions.json
    # zip paths, index.html, changelog.html -- is relative and works as-is on
    # any host). Left untouched it would send internal users back out to
    # github.io and straight through the proxy this mirror exists to avoid, so
    # point it at this Pages site instead. CI_PAGES_URL is provided by GitLab.
    - sed -i "s|https://nazeer-hussain.github.io/CAD3PLogBrowser|${CI_PAGES_URL}|g" public/version.json

    # Surface the rewritten manifest in the job log: this is the exact URL
    # internal users need for Options > Settings > update manifest URL.
    - echo "Internal manifest URL -> ${CI_PAGES_URL}/version.json"
    - cat public/version.json

  artifacts:
    paths:
      - public
