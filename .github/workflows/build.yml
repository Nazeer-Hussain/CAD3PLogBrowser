name: Build & Verify

# Runs on every push and PR so a broken build is caught immediately, but never
# bumps the version, publishes to docs/, or creates a release -- that only
# happens when someone deliberately runs the separate "Release" workflow (see
# release.yml). This lets several merged PRs accumulate on master and ship
# together whenever a release is actually wanted, instead of every single
# merge becoming its own release.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore Cad3PLogBrowser.sln

      - name: Build (Release / Any CPU)
        run: |
          msbuild Cad3PLogBrowser.sln `
            /p:Configuration=Release `
            "/p:Platform=Any CPU" `
            /m

      # Packaged and uploaded purely so a reviewer can download and try a PR's
      # build from the Actions run -- this zip is never published anywhere and
      # never touches docs/version.json. The actual shippable release zip is
      # built fresh by release.yml.
      - name: Package portable zip (verification artifact only)
        id: package
        shell: pwsh
        run: |
          $stagingDir = "staging"
          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          Copy-Item "Cad3PLogBrowser\bin\Release\Cad3PLogBrowser.exe" $stagingDir
          Copy-Item "Cad3PLogBrowser\bin\Release\Cad3PLogBrowser.exe.config" $stagingDir
          Copy-Item "Cad3PLogBrowser\bin\Release\Help" "$stagingDir\Help" -Recurse

          $zipName = "Cad3PLogBrowser-build-$($env:GITHUB_SHA.Substring(0,7)).zip"
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -CompressionLevel Optimal
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cad3PLogBrowser-build-${{ github.sha }}
          path: ${{ steps.package.outputs.ZIP_NAME }}
          if-no-files-found: error
