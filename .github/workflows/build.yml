name: Build & Release

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ?? 1. Checkout (full history so we can push back) ????????????????????
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ?? 2. Bump patch on master, read version everywhere else ?????????????
      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $json  = Get-Content version.json -Raw | ConvertFrom-Json
          $parts = $json.version -split '\.'   # ["3","1","0"]

          if ($env:GITHUB_REF -eq 'refs/heads/master' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            # Auto-increment patch digit
            $parts[2] = [string]([int]$parts[2] + 1)

            $newVer  = $parts -join '.'                                   # "3.1.1"
            $newUrl  = "https://github.com/Nazeer-Hussain/CAD3PLogBrowser/releases/download/v$newVer/Cad3PLogBrowser.exe"

            # Update version.json
            $json.version     = $newVer
            $json.downloadUrl = $newUrl
            $json | ConvertTo-Json -Depth 5 | Set-Content version.json -Encoding UTF8

            # Update AssemblyInfo.cs  (store as major.minor.patch.0 for .NET)
            $asmVer = "$newVer.0"
            $ai     = Get-Content Cad3PLogBrowser\Properties\AssemblyInfo.cs -Raw
            $ai     = $ai -replace 'AssemblyVersion\("[^"]+"\)',     "AssemblyVersion(`"$asmVer`")"
            $ai     = $ai -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$asmVer`")"
            Set-Content Cad3PLogBrowser\Properties\AssemblyInfo.cs $ai -Encoding UTF8
          } else {
            $newVer = $parts -join '.'
          }

          $tag = "v$newVer"
          echo "VERSION=$newVer" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag"        >> $env:GITHUB_OUTPUT

      # ?? 3. Build ???????????????????????????????????????????????????????????
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore Cad3PLogBrowser.sln

      - name: Build (Release / Any CPU)
        run: |
          msbuild Cad3PLogBrowser.sln `
            /p:Configuration=Release `
            "/p:Platform=Any CPU" `
            /m

      # ?? 4. Upload build artifact (every branch / PR) ??????????????????????
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cad3PLogBrowser-${{ steps.ver.outputs.VERSION }}
          path: Cad3PLogBrowser\bin\Release\Cad3PLogBrowser.exe
          if-no-files-found: error

      # ?? 5. Commit bumped files back to master ?????????????????????????????
      - name: Commit version bump
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json Cad3PLogBrowser/Properties/AssemblyInfo.cs
          git commit -m "chore: bump version to ${{ steps.ver.outputs.VERSION }} [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ?? 6. Create GitHub Release (master push only) ???????????????????????
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "Release ${{ steps.ver.outputs.TAG }}"
          body: |
            **Version:** `${{ steps.ver.outputs.VERSION }}`

            - **Patch** (`x.x.N`) — auto-incremented on every master build
            - **Minor** (`x.N.x`) — bumped manually for major enhancements
            - **Major** (`N.x.x`) — bumped manually for breaking changes
          files: Cad3PLogBrowser\bin\Release\Cad3PLogBrowser.exe
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
